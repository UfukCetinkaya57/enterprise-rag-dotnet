# rag.ufukcetinkaya.com — Kurumsal Doküman Asistanı (RAG demo) reverse proxy.
#
# Bu dosya SADECE bu alan adı için ayrı bir server bloğudur; sunucudaki diğer
# siteleri (kendi sites-available dosyaları) etkilemez.
#
# Kurulum (sunucuda):
#   sudo cp deploy/nginx/rag.ufukcetinkaya.com.conf /etc/nginx/sites-available/rag.ufukcetinkaya.com
#   sudo ln -s /etc/nginx/sites-available/rag.ufukcetinkaya.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sertifikayı certbot 'certonly --webroot' ile alıyoruz (aşağıdaki 443 bloğu
# elle yazıldığı için certbot config'e DOKUNMAZ). Komutlar README "Deployment"ta.
#
# API upstream 127.0.0.1:8092 (docker-compose.prod.yml). Port değişirse burada da değiştir.

upstream rag_api {
    server 127.0.0.1:8092;
    keepalive 16;
}

# --- HTTP: ACME doğrulaması + HTTPS'e yönlendirme ---
server {
    listen 80;
    listen [::]:80;
    server_name rag.ufukcetinkaya.com;

    # certbot HTTP-01 (webroot) doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: reverse proxy ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.ufukcetinkaya.com;

    # İLK certbot çalışmadan ÖNCE bu iki satır yoksa nginx -t hata verir.
    # Sırayla: (1) önce yalnızca 80 bloğuyla reload → certbot certonly → (2) bu bloğu aç.
    # README bu sırayı adım adım anlatır.
    ssl_certificate     /etc/letsencrypt/live/rag.ufukcetinkaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.ufukcetinkaya.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rag_ssl:10m;
    ssl_session_timeout 1d;

    # Upload sınırı: uygulama 10 MB, pay ile 12 MB (multipart overhead).
    client_max_body_size 12m;

    # --- Güvenlik header'ları ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Diagnostics: çift katman kilit (uygulama Production'da 404 döner, burada da deny) ---
    location /api/diagnostics {
        return 404;
    }

    # --- SSE: token-token akış. Buffering KAPALI, uzun timeout, HTTP/1.1. ---
    location /api/chat/stream {
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Gerçek client IP (uygulama rate limiting buna bağlı).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE olmazsa olmazları:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no" always;
    }

    # --- Diğer tüm istekler (UI + /api/chat + /api/documents + /health) ---
    location / {
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
