# rag.ufukcetinkaya.com — AŞAMA 1: yalnızca HTTP (80) + ACME webroot.
# Sertifika HENÜZ yokken kullanılır; certbot certonly --webroot bununla çalışır.
# Sertifika alındıktan SONRA bu dosya, tam conf (rag.ufukcetinkaya.com.conf) ile değiştirilir.
#
# Bu geçici conf sayesinde ilk 'nginx -t' ssl_certificate referansı olmadan GEÇER.

server {
    listen 80;
    listen [::]:80;
    server_name rag.ufukcetinkaya.com;

    # certbot HTTP-01 (webroot) doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sertifika alınana kadar kök basit bir 200 döner (yönlendirme yok; 443 henüz yok).
    location / {
        return 200 "rag.ufukcetinkaya.com hazirlaniyor...\n";
        add_header Content-Type text/plain;
    }
}
