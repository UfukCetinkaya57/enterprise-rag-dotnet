services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kurumsalrag-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kurumsalrag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOT: Şema artık uygulama tarafında DatabaseInitializer ile (seçili sağlayıcının
      # embedding boyutunda) oluşturulur. Sabit boyutlu init.sql mount EDİLMEZ.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-kurumsalrag}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
